<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <h1>Hi, welcome to Danny's awesome webpage!</h1>

    <p2>
      None of your information will be stored! This webpage has
      <strong>172 levels</strong> of cybersecurity and will
      <strong>NEVER</strong> get <em>hacked</em>!!! ;)
    </p2>

    <form method="get" action="thankyou.html">
      <br />
      <br />
      <br />
      <br />
      <label for="useremail">Email:</label>
      <input
        type="email"
        id="useremail"
        name="useremail"
        placeholder="johndoe@gmail.com"
      />
      <br />
      <label for="userpass"> Password:</label>
      <input type="password" id="userpass" name="userpass" placeholder="enter password"/>

      <br />

      <br />

      <label for="usermood">How are you feeling?</label>
      <select id="usermood" name="usermood">
        <option value="Excited">Excited</option>
        <option value="Sad">Sad</option>
        <option value="Spicy">Spicy</option>
        <option value="Adventerous">Adventerous</option>
        <option value="Marvelous">Marvelous</option>
        <option value="Naughty">Naughty</option>
        <option value="I want to give danny $12">
          I want to give danny $12
        </option>
      </select>
      <br />
      <br />
      <label for="userreview">Tell me about your weekend: </label>
      <textarea name="userreview" id="userreview" cols="50" rows="5"></textarea>
      <br />
      <input type="submit" value="Submit" />
    </form>
  </body>
</html>
